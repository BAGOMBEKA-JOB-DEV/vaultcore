apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultcore-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/vaultcore
  DB_USER: vaultcore
  # Set an issuer reachable by pods before deploying.
  JWT_ISSUER_URI: https://identity.example.com/realms/vaultcore
  JWT_AUDIENCE: vaultcore-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultcore
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vaultcore
  template:
    metadata:
      labels:
        app: vaultcore
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: vaultcore:dev
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vaultcore-config
            - secretRef:
                name: vaultcore-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 448Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultcore
spec:
  selector:
    app: vaultcore
  ports:
    - port: 8080
      targetPort: http
