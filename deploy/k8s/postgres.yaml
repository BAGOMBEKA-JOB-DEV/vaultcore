apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: vaultcore-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: vaultcore-postgres
  template:
    metadata:
      labels:
        app: vaultcore-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: POSTGRES_DB
              value: vaultcore
            - name: POSTGRES_USER
              value: vaultcore
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultcore-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=20"]
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vaultcore", "-d", "vaultcore"]
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
