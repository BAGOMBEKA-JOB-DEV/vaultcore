name: vaultcore

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_NAME:-vaultcore}
      POSTGRES_USER: ${DB_USER:-vaultcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./scripts/setup.sh to create .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 192m
    cpus: 0.5
    shm_size: 32m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 20s

volumes:
  postgres-data:
