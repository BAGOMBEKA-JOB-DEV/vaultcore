name: vaultcore

services:
  app:
    build: .
    image: vaultcore:dev
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vaultcore}
      DB_USER: ${DB_USER:-vaultcore}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8180/realms/vaultcore}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vaultcore-api}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 448m
    cpus: 1
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_NAME:-vaultcore}
      POSTGRES_USER: ${DB_USER:-vaultcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 192m
    cpus: 0.5
    shm_size: 32m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 20s

volumes:
  postgres-data:
